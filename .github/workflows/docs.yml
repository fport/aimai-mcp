name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group docs

      # --strict turns a broken internal link into a failed build instead of
      # a 404 someone finds later.
      - name: Build the site
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    # Pages is not available on a private repository without a paid plan, and
    # `deploy-pages` fails with a bare 404 when it is off -- which would paint
    # this workflow red on every docs commit for a reason that is not a
    # problem with the docs. The build job above still runs and still fails on
    # a broken link, so nothing goes unchecked. Flip the repository to public
    # and this job starts deploying on the next push, with no edit here.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
