site_name: aimai-mcp
site_description: An MCP server, a policy-gated client, and the security layer between them
site_url: https://fport.github.io/aimai-mcp/
repo_url: https://github.com/fport/aimai-mcp
repo_name: fport/aimai-mcp
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark first, matching aimai-kit and aimai-workflows: one body of work.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/neon.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Without this a ```mermaid block renders as highlighted source
        # instead of a diagram: Material ships the renderer, superfences has
        # to hand it the block.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: tr
          name: Türkçe
          build: true
          nav_translations:
            Start here: Buradan başla
            Overview: Genel bakış
            The SDK break: SDK kırılması
            Design: Tasarım
            The plan lock: Plan kilidi
            The lethal trifecta: Ölümcül üçlü
            Human approval: İnsan onayı
            Results: Sonuçlar

nav:
  - Start here:
      - Overview: index.md
      - The SDK break: sdk-break.md
  - Design:
      - The plan lock: plan-lock.md
      - The lethal trifecta: trifecta.md
      - Human approval: approval.md
  - Results: results.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fport/aimai-mcp
    - icon: material/toolbox
      link: https://github.com/fport/aimai-kit
